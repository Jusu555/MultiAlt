name: Build Full Windows Setup EXE

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/windows-setup-exe.yml"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build full NSIS setup EXE
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ENABLE_NEXUS: "true"
          VITE_ENABLE_WEBSERVER: "true"
          VITE_ENABLE_AVATAR_BATCH: "true"
        run: bun run tauri build --bundles nsis --features full

      - name: Upload setup EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MultiAlt-Full-Setup-EXE-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
